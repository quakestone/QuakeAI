name = "quakeai-gateway"
main = "build/index.js"
compatibility_date = "2026-10-01"

# 资源账本 Durable Object：渠道 / Key / 健康状态 / 降权事件都存这里。
# 免费计划必须用 new_sqlite_classes（SQLite-backed DO；KV-backed 的 new_classes 仅付费计划可用，
# 用错会在 deploy 最后一步报 code 10097）。DO 代码只用通用 KV API，两种后端零改动兼容。
# 改了类名必须加新的 migration tag。
[[durable_objects.bindings]]
name = "RESOURCE_STORE"
class_name = "ResourceStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResourceStore"]

# 密钥不要写在这里 —— 用 `npx wrangler secret put ZHIPU_API_KEY` / `ADMIN_TOKEN`。
# 非敏感配置（可选）：
# [vars]
# ZHIPU_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
