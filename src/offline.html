<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>离线 · QuakeAI 网关</title>
<style>
  :root { color-scheme: dark; --bg:#0e0f14; --panel:#171922; --border:#262a38; --txt:#e8eaf2; --dim:#8b90a4; --acc:#6c8cff; --ok:#41c08a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:min(400px,100%); background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; }
  .logo { width:52px; height:52px; margin:0 auto 14px; border-radius:14px; background:linear-gradient(135deg,var(--acc),#5a8bff);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#fff; }
  h1 { font-size:17px; margin:0 0 8px; font-weight:600; }
  p { margin:0 0 18px; color:var(--dim); font-size:13px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:6px; vertical-align:middle; }
  .dot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  button { width:100%; padding:11px 0; border-radius:10px; border:1px solid var(--acc); background:transparent;
    color:var(--acc); font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:rgba(108,140,255,.12); }
  .tip { margin-top:14px; font-size:11px; color:var(--dim); }
  a { color:var(--acc); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>网络已断开</h1>
    <p><span class="dot" id="dot"></span><span id="state">正在等待网络恢复…</span></p>
    <button id="retry" type="button">重新连接</button>
    <div class="tip">这是离线兜底页——你的会话记录保存在本机。<br>网络恢复后会自动回到聊天界面。</div>
  </div>
<script>
  var dot = document.getElementById("dot"), st = document.getElementById("state");
  function paint() {
    var on = navigator.onLine;
    dot.className = "dot" + (on ? " on" : "");
    st.textContent = on ? "网络已恢复，正在返回…" : "正在等待网络恢复…";
    if (on) setTimeout(function () { location.replace("/"); }, 600);
  }
  document.getElementById("retry").onclick = function () {
    if (navigator.onLine) location.replace("/");
    else { st.textContent = "仍然离线，请检查 Wi-Fi / 移动数据"; }
  };
  window.addEventListener("online", paint);
  window.addEventListener("offline", paint);
  paint();
</script>
</body>
</html>
