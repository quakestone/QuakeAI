name: deploy-worker

# 云端部署：push 到 main 即自动把预编译产物发到 Cloudflare Workers。
# 本地不需要 Node，也不需要 Rust（build/ 目录里的产物已随仓库提交）。
#
# 需要先在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN  权限选 "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID Cloudflare 面板右侧栏可见

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
