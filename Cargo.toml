[package]
name = "zhipu-wasm-gateway"
version = "0.17.0"
edition = "2021"
description = "WASM AI 聚合网关：资源管理 + 智能路由（Rust → Cloudflare Workers）"

[lib]
# rlib 仅用于 host target 跑单元测试（cargo test --lib）；wasm 构建仍取 cdylib。
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
