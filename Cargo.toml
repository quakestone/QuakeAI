[package]
name = "zhipu-wasm-gateway"
version = "0.19.34"
edition = "2021"
description = "WASM AI 聚合网关：资源管理 + 智能路由（Rust → 浏览器 WASM，纯客户端 PWA，脱钩 Cloudflare）"

[lib]
# rlib 仅用于 host target 跑单元测试（cargo test --lib）；wasm 构建取 cdylib。
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "WorkerGlobalScope",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ResponseInit",
    "Headers",
    "FormData",
    "File",
    "Blob",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamDefaultController",
    "UnderlyingSource",
    "Url",
] }

[profile.release]
opt-level = "s"
lto = true
